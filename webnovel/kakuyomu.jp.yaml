# ------------------------------------------------------------
# 小説サイト定義
name: &name カクヨム
scheme: https
domain: kakuyomu.jp
top_url: \\k<scheme>://\\k<domain>
url: \\k<top_url>/works/(?<ncode>\d+)
encoding: UTF-8
confirm_over18: no
append_title_to_folder_name: yes
title_strip_pattern: null
sitename: *name
version: 2.1

# ------------------------------------------------------------
# 前処理設定
# jsonを処理して正規表現で取得可能なデータへ変換し挿入する
code: &code
  eval: |-
    magicword = "KakuyomuPreprocessEvalMagicWord"
    # magicwordがある場合、既にこの前処理が行われているので何もしない
    unless source.include?(magicword)
      require "json"
      source.match(%r|<script id="__NEXT_DATA__" type="application/json">(.*)</script>|) do |m|
        json = JSON.parse($1)
        # data: 各データが収められたハッシュ
        data = json["props"]["pageProps"]["__APOLLO_STATE__"]
        # work: この作品のデータ
        work = data["Work:#{json["query"]["workId"]}"]
        next unless work.is_a?(Hash)

        # まずTOCを処理する
        toc_refs =
          if work["tableOfContentsV2"].is_a?(Array) && !work["tableOfContentsV2"].empty?
            work["tableOfContentsV2"]
          elsif work["tableOfContents"].is_a?(Array) && !work["tableOfContents"].empty?
            work["tableOfContents"]
          else
            []
          end

        toc = []

        # 新旧どちらの形式でも参照を解決してTOCを組み立てる
        toc_refs.each do |ref|
          next unless ref.is_a?(Hash) && ref["__ref"]
          chapter_group = data[ref["__ref"]]
          next unless chapter_group.is_a?(Hash)

          chapter = chapter_group["chapter"]
          episode_unions = chapter_group["episodeUnions"]

          # 旧形式: tableOfContentsChapter の参照配列を想定
          # 新形式: tableOfContentsV2 でも中身は同様の参照を辿れる想定
          items = [chapter, episode_unions].flatten.compact
          items.each do |item|
            next unless item.is_a?(Hash) && item["__ref"]
            toc << data[item["__ref"]]
          end
        end

        # もし新形式で chapter_group が直接取れる構造ならそれを拾う
        if toc.empty?
          direct_chapter_group = data["TableOfContentsChapter:"]
          if direct_chapter_group.is_a?(Hash)
            [direct_chapter_group["chapter"], direct_chapter_group["episodeUnions"]].flatten.compact.each do |item|
              next unless item.is_a?(Hash) && item["__ref"]
              toc << data[item["__ref"]]
            end
          end
        end

        # Chapterが使われていない場合にあるnilを排除し
        toc.compact!

        # 必要な属性値を取り出して「;」でつないでまとめる
        # __typename: ChapterかEpisodeかの判別用
        # level: Chapterにあり1か2かでchapterかsubchapterか判別する
        # id: Episodeならindex値として必要。Chapterなら必要ないが処理の簡略化のため付加している
        # publishedAt: Episodeにありsubupdateとして利用する
        # title: Chapter、Episode共にタイトルとなる
        # 最後のtitle以外で「;」を含む事は無いはず
        toc_attr = %w(__typename level id publishedAt title)
        toc.map! {|v| v.is_a?(Hash) ? v.slice(*toc_attr).values.join(";") : nil}
        toc.compact!

        # 続いてworkの著者を処理する
        # 著者の参照から表示用の名前 activityName を取得する
        author_ref = work["author"]
        if author_ref.is_a?(Hash) && author_ref["__ref"] && data[author_ref["__ref"]].is_a?(Hash)
          work["author"] = data[author_ref["__ref"]]["activityName"]
        end

        # alternateAuthorName がある場合は、それも使う。
        work["author"] = work["alternateAuthorName"] + "／" + work["author"] if work["alternateAuthorName"] && work["author"]

        # あらすじの改行を<br>に変換し、正規表現を単純化する。<br>はnarourb側で再変換される
        work["introduction"].gsub!("\n", "<br>") if work["introduction"].is_a?(String)

        # tagLabelsを個別のタグ行として処理
        if work["tagLabels"] && work["tagLabels"].is_a?(Array) && !work["tagLabels"].empty?
          tag_lines = work["tagLabels"].map {|tag| "tag::#{tag}"}.join("\n")
          work["tagLabels"] = tag_lines
        else
          work["tagLabels"] = ""
        end

        # workからTOC以外に利用する属性を列挙している（tagLabelsは別途処理）
        work_attr = %w(author title serialStatus publicEpisodeCount publishedAt
            editedAt lastEpisodePublishedAt totalCharacterCount introduction)

        # HTMLコメントの開始、前処理済みか検知するためのmagicword、
        # TOC以外のworkの利用する属性値、タグデータ、TOC、HTMLコメントの終了を生成し
        str = ["<!---", magicword,
          work.slice(*work_attr).map {|v| v.join("::")},
          work["tagLabels"],
          toc, "--->"].join("\n")

        # 元のページデータに挿入する。デバッグ時用に元々のデータはすべて残す。
        source.insert(m.begin(0), str)
        # 元々のデータは基本必要ないのでreplaceを使えば元々のデータはすべて消える。
        #source.replace(str)
      end
    end
    nil

# ------------------------------------------------------------
# 書籍情報取得設定
title: &title
  - *code
  - ^title::(?<title>.+?)$
author:
  - ^author::(?<author>.+?)$
story: &story
  - ^introduction::(?<story>.+?)$

# ------------------------------------------------------------
# 目次取得設定
toc_url: \\k<top_url>/works/\\k<ncode>
subtitles:
  - *code
  - (?x)
    ^(?:Chapter;1;\d+;(?<chapter>.+?)\n)?
    (?:Chapter;2;\d+;(?<subchapter>.+?)\n)?
    Episode;(?<index>\d+);(?<subupdate>.+?);(?<subtitle>.+?)$
href: /works/\\k<ncode>/episodes/\\k<index>

# ------------------------------------------------------------
# 本文取得設定

body_pattern: <div class="widget-episodeBody js-episode-body".*?>(?<body>.+?)</div>
introduction_pattern: null
postscript_pattern: null

# ------------------------------------------------------------
# 小説情報からパースするための設定
novel_info_url: \\k<toc_url>

# タイトル
t: *title

# novel_type 小説種別
nt: ^serialStatus::(?<novel_type>.+?)$
novel_type_string:
  RUNNING: 1
  COMPLETED: 3

# general_all_no 掲載話数
ga: ^publicEpisodeCount::(?<general_all_no>.+?)$

# story あらすじ
s: *story

# general_firstup 初回掲載日
gf: ^publishedAt::(?<general_firstup>.+?)$

# novelupdated_at 小説の更新時刻
nu: ^editedAt::(?<novelupdated_at>.+?)$

# general_lastup 最新話掲載日
gl: ^lastEpisodePublishedAt::(?<general_lastup>.+?)$

# writer 作者名
w: ^author::(?<writer>.+?)$

# length 文字数
l: ^totalCharacterCount::(?<length>.+?)$

# tags タグ
tags: ^tag::(?<tag>.+?)$
